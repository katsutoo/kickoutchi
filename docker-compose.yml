services:
  postgres:
    image: postgres:17-alpine
    container_name: kickoutchi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kickoutchi
      POSTGRES_USER: kickoutchi
      POSTGRES_PASSWORD: kickoutchi
    ports:
      - "5432:5432"
    volumes:
      - kickoutchi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kickoutchi -d kickoutchi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kickoutchi_postgres_data:
