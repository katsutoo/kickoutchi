[package]
name = "kickoutchi"
version = "1.3.3"
edition = "2024"
rust-version = "1.95.0"
description = "A clean TUI and CLI port janitor: see which process owns each open local port and kick it out safely"
license = "MIT"
repository = "https://github.com/nuggocto/kickoutchi"
homepage = "https://kickoutchi.com"
authors = ["nugget <vincent@sshmoi.com>"]
readme = "README.md"
keywords = ["ports", "processes", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["mise.toml"]
# Two binary names are declared below; `cargo run` without --bin needs this.
default-run = "kickoutchi"

# The same program ships under two names: `kickoutchi` is canonical (matches
# the crate, docs, and kickoutchi.com), `kick` is the short form for daily CLI
# use (`kick list`, `kick kill --port 3000`). Declaring any [[bin]] disables
# bin auto-discovery, so the canonical target must be declared explicitly too.
# `kick` was checked against the Arch repos, the AUR, and crates.io before
# adoption (2026-06-11); `ko` was rejected as taken by the Go container tool.
[[bin]]
name = "kickoutchi"
path = "src/bin/kickoutchi.rs"

[[bin]]
name = "kick"
path = "src/bin/kick.rs"

[dependencies]
# TUI + terminal control. crossterm is kept as a direct dependency (not only via
# ratatui's re-export) because the event loop and terminal lifecycle use it.
ratatui = "0.30.0"
crossterm = "0.29.0"

# CLI parsing and (de)serialization. Declared up front so the shared model,
# config, and non-TUI commands build on a fixed dependency set rather than
# churning Cargo.toml feature flags later.
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"

# Error handling and diagnostics. Typed errors keep module boundaries explicit;
# tracing logs diagnostics to stderr only, never to the TUI surface.
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Platform config-directory resolution (XDG on Linux), for config-file loading
# in the shared model/config/CLI foundation.
dirs = "6.0.0"

# Terminal column widths for table padding and bounded endpoint-label display:
# byte length misaligns columns for accented/CJK text. Already in the dependency
# tree via ratatui, so this adds no new supply-chain weight.
unicode-width = "0.2.2"

# Exact bind diagnostics require setting reuse-address and IPv6-only behavior
# before bind. Keep the dependency exact and on its empty default feature set;
# in particular, do not enable its broad `all` API surface.
socket2 = "=0.6.5"

# The update worker makes one bounded HTTPS request. Keep ureq exact and omit
# compression, JSON, cookies, and proxy extras; serde_json parses the tiny body.
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
# Security-sensitive workflow key discovery uses a full YAML parser so quoted,
# sequence-shorthand, and flow-mapping keys cannot bypass the contract tests.
serde_yaml_ng = { version = "=0.10.0", default-features = false }

# Release-only archive verification. These stay out of the shipped binaries and
# replace the former Python validator with bounded native Rust parsers.
sha2 = { version = "=0.10.9", default-features = false }
tar = { version = "=0.4.46", default-features = false }
lzma-rust2 = { version = "=0.15.5", default-features = false, features = ["encoder", "std", "xz"] }
xz4rust = { version = "=0.2.2", default-features = false, features = ["bcj", "crc64", "delta", "no_unsafe", "sha256", "std"] }
zip = { version = "=8.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
# Unix termination uses the OS signal API directly for SIGTERM/SIGKILL instead
# of shelling out to `kill`; the unsafe boundary is kept inside process.rs.
# macOS collection also uses libc's libproc/sysctl bindings directly.
libc = "0.2.177"

[target.'cfg(windows)'.dependencies]
# Windows collection uses IP Helper directly, and termination uses process
# handles so the signal target cannot wander off after confirmation.
windows-sys = { version = "0.61.2", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints.clippy]
pedantic = "warn"
# Every lint suppression must say why it exists. A silenced lint with no stated
# reason is indistinguishable from one that stopped being needed, which is
# exactly how a stale `allow` survives review. Prefer `expect` over `allow`
# where the lint is guaranteed to fire on every target: `expect` warns once the
# suppression becomes unnecessary, so it cleans itself up. `allow` remains
# correct for suppressions that only apply on some targets, where `expect`
# would fire `unfulfilled_lint_expectations` on the others.
allow_attributes_without_reason = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
