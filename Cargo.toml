[package]
name = "kickoutchi"
version = "0.1.0"
edition = "2024"
description = "A clean TUI port janitor: see which process owns each open local port and kick it out safely"
license = "MIT"
repository = "https://github.com/nuggocto/kickoutchi"
authors = ["nugget <vincent.lemaire1999@gmail.com>"]
readme = "README.md"
# Two binary names are declared below; `cargo run` without --bin needs this.
default-run = "kickoutchi"

# The same program ships under two names: `kickoutchi` is canonical (matches
# the crate, docs, and kickoutchi.com), `kick` is the short form for daily CLI
# use (`kick list`, `kick kill --port 3000`). Declaring any [[bin]] disables
# bin auto-discovery, so the canonical target must be declared explicitly too.
# `kick` was checked against the Arch repos, the AUR, and crates.io before
# adoption (2026-06-11); `ko` was rejected as taken by the Go container tool.
[[bin]]
name = "kickoutchi"
path = "src/bin/kickoutchi.rs"

[[bin]]
name = "kick"
path = "src/bin/kick.rs"

[dependencies]
# TUI + terminal control. crossterm is kept as a direct dependency (not only via
# ratatui's re-export) because the event loop and terminal lifecycle use it.
ratatui = "0.30.0"
crossterm = "0.29.0"

# CLI parsing and (de)serialization. Declared now so the shared model, config,
# and non-TUI commands in the next phase build on a fixed dependency set rather
# than churning Cargo.toml feature flags later.
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"

# Error handling: thiserror for typed boundaries, anyhow reserved for internal
# context. Tracing logs diagnostics to stderr only, never to the TUI surface.
thiserror = "2.0.18"
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Platform config-directory resolution (XDG on Linux). Added in Phase 1 because
# config-file loading is part of the shared model/config/CLI foundation.
dirs = "6.0.0"

# Platform/process/clipboard crates (sysinfo, libc, windows-sys, arboard) are
# intentionally NOT added here. They land in the phases that first use them so
# `--all-features` stays buildable on every host during Phase 0.

[lints.rust]
warnings = "deny"

[lints.clippy]
pedantic = "warn"
