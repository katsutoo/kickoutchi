name: Release Qualification

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful non-publishing Release workflow run containing candidate archives
        required: true
        default: "30046834702"
        type: string
      run_benchmarks:
        description: Run the full native Linux and Windows benchmark protocol after QA passes
        required: true
        default: false
        type: boolean
      benchmark_smoke:
        description: Run bounded non-gate Linux and Windows benchmark preflights
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_COMMIT: 7393b56a5d86a5e2afb298cf6d1eb185a77bf02a

jobs:
  authorize-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify immutable candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        shell: bash
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || {
            echo "candidate run ID must be decimal" >&2
            exit 1
          }
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          [[ "$(jq -r .head_sha <<<"$run_json")" == "$CANDIDATE_COMMIT" ]] || {
            echo "candidate run belongs to another commit" >&2
            exit 1
          }
          [[ "$(jq -r .name <<<"$run_json")" == "Release" ]] || {
            echo "candidate artifacts must come from the Release workflow" >&2
            exit 1
          }
          [[ "$(jq -r .status <<<"$run_json")" == "completed" && "$(jq -r .conclusion <<<"$run_json")" == "success" ]] || {
            echo "candidate Release run did not complete successfully" >&2
            exit 1
          }

  qa:
    needs: authorize-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            artifact: artifacts-build-local-x86_64-unknown-linux-gnu
            archive: kickoutchi-x86_64-unknown-linux-gnu.tar.xz
            root: kickoutchi-x86_64-unknown-linux-gnu
            candidate_binary_sha256: 847fcf0ab12648cd0ccd3b2f30870e26a3b263b69956c5a2206d6f9c8a159855
            baseline_url: https://github.com/nuggocto/kickoutchi/releases/download/v1.2.0/kickoutchi-x86_64-unknown-linux-gnu.tar.xz
            baseline_archive_sha256: f855ba6c0c0e4a08096aa180de67999d918d2b883a84f201922012d47504548c
            baseline_binary_sha256: f8a3174ec13689348def30f69801103d1640e796de4195d3acf7faba797be3cc
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            artifact: artifacts-build-local-aarch64-unknown-linux-gnu
            archive: kickoutchi-aarch64-unknown-linux-gnu.tar.xz
            root: kickoutchi-aarch64-unknown-linux-gnu
            candidate_binary_sha256: aabbfafa7054da8f16536062fd449219fe88462987bb7b2ace785c73085034c2
            baseline_url: https://github.com/nuggocto/kickoutchi/releases/download/v1.2.0/kickoutchi-aarch64-unknown-linux-gnu.tar.xz
            baseline_archive_sha256: 5f461a111998e722ed46206487efd006f50274490d95f8fc05ab43937fd290cb
            baseline_binary_sha256: 4c62559406478dde4eaf3889c67a607a8cb762096a899a72032547bb7b16eb05
          - name: macos-x86_64
            runner: macos-15-intel
            artifact: artifacts-build-local-x86_64-apple-darwin
            archive: kickoutchi-x86_64-apple-darwin.tar.xz
            root: kickoutchi-x86_64-apple-darwin
            candidate_binary_sha256: 5407bd94f646e71972008b11246c55ce0d34fbcdf3ec53ea983d16e2a4225774
            baseline_url: https://github.com/nuggocto/kickoutchi/releases/download/v1.2.0/kickoutchi-x86_64-apple-darwin.tar.xz
            baseline_archive_sha256: d49f6a6f8eceff91bb29d7a95440c20c5e37f1bf7d29fa8ce431cd7aeab5d107
            baseline_binary_sha256: 6aae55ee92d38872ff502d9cd7b68419d1415c45046b4f174432f3b85a61ad3b
          - name: macos-aarch64
            runner: macos-14
            artifact: artifacts-build-local-aarch64-apple-darwin
            archive: kickoutchi-aarch64-apple-darwin.tar.xz
            root: kickoutchi-aarch64-apple-darwin
            candidate_binary_sha256: 54177695affffec2a0d2f06c9d339c5138bd39973980c8d64be3a5ceef9ec72c
            baseline_url: https://github.com/nuggocto/kickoutchi/releases/download/v1.2.0/kickoutchi-aarch64-apple-darwin.tar.xz
            baseline_archive_sha256: 61316172860d1f0c7f51add62ada6ddbabf5db12aea12b87be561b3774fe8c6c
            baseline_binary_sha256: 296965f58a74f75657fdb723e649f84fdb74d5c39064b411eea98c0af8ae4060
          - name: windows-x86_64
            runner: windows-2022
            artifact: artifacts-build-local-x86_64-pc-windows-msvc
            archive: kickoutchi-x86_64-pc-windows-msvc.zip
            root: .
            candidate_binary_sha256: 431a4bec837e32f4daf7f206286e007072f4373c5a9636ab81a97c1930df897d
            baseline_url: https://github.com/nuggocto/kickoutchi/releases/download/v1.2.0/kickoutchi-x86_64-pc-windows-msvc.zip
            baseline_archive_sha256: 71a5004a8d503284034659e70e1d5a861e26d9f362ea0f42c097518718db8d24
            baseline_binary_sha256: e21a7d01ed920370a85b1064908600bf0db4e38cfe73d6ddade934f90adb01bb
    name: QA (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Test QA harness
        run: python3 -m unittest -v qa.test_release_qa qa.test_extended_release_qa

      - name: Download exact candidate archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - id: unix-artifact
        name: Verify and extract Unix candidate
        if: runner.os != 'Windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
          ROOT: ${{ matrix.root }}
          CANDIDATE_BINARY_SHA256: ${{ matrix.candidate_binary_sha256 }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP/candidate"
          expected="$(cut -d ' ' -f 1 "${ARCHIVE}.sha256")"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || {
            echo "candidate checksum sidecar is malformed" >&2
            exit 1
          }
          actual="$(shasum -a 256 "$ARCHIVE" | cut -d ' ' -f 1)"
          [[ "$actual" == "$expected" ]] || {
            echo "candidate archive checksum mismatch" >&2
            exit 1
          }
          mkdir extracted
          tar -xJf "$ARCHIVE" -C extracted
          [[ -x "extracted/${ROOT}/kickoutchi" && -x "extracted/${ROOT}/kick" ]] || {
            echo "candidate archive did not preserve both executable payloads" >&2
            exit 1
          }
          [[ "$(shasum -a 256 "extracted/${ROOT}/kick" | cut -d ' ' -f 1)" == "$CANDIDATE_BINARY_SHA256" ]] || {
            echo "candidate executable checksum mismatch" >&2
            exit 1
          }
          echo "canonical=${RUNNER_TEMP}/candidate/extracted/${ROOT}/kickoutchi" >> "$GITHUB_OUTPUT"
          echo "short=${RUNNER_TEMP}/candidate/extracted/${ROOT}/kick" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$actual" >> "$GITHUB_OUTPUT"

      - id: windows-artifact
        name: Verify and extract Windows candidate
        if: runner.os == 'Windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
          CANDIDATE_BINARY_SHA256: ${{ matrix.candidate_binary_sha256 }}
        shell: pwsh
        run: |
          $candidate = "$env:RUNNER_TEMP\candidate"
          $sidecar = (Get-Content -LiteralPath "$candidate\$env:ARCHIVE.sha256" -Raw).Trim()
          if ($sidecar -notmatch '^([0-9a-f]{64}) [ *][^\r\n]+$') { throw "candidate checksum sidecar is malformed" }
          $expected = $Matches[1]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath "$candidate\$env:ARCHIVE").Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "candidate archive checksum mismatch" }
          Expand-Archive -LiteralPath "$candidate\$env:ARCHIVE" -DestinationPath "$candidate\extracted"
          foreach ($binary in @('kickoutchi.exe', 'kick.exe')) {
            if (-not (Test-Path -LiteralPath "$candidate\extracted\$binary" -PathType Leaf)) { throw "candidate archive is missing $binary" }
          }
          $shortActual = (Get-FileHash -Algorithm SHA256 -LiteralPath "$candidate\extracted\kick.exe").Hash.ToLowerInvariant()
          if ($shortActual -ne $env:CANDIDATE_BINARY_SHA256) { throw "candidate executable checksum mismatch" }
          "canonical=$candidate\extracted\kickoutchi.exe" >> $env:GITHUB_OUTPUT
          "short=$candidate\extracted\kick.exe" >> $env:GITHUB_OUTPUT
          "archive_sha256=$actual" >> $env:GITHUB_OUTPUT

      - id: baseline-unix
        name: Download and verify Unix baseline
        if: runner.os != 'Windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
          ROOT: ${{ matrix.root }}
          BASELINE_URL: ${{ matrix.baseline_url }}
          BASELINE_ARCHIVE_SHA256: ${{ matrix.baseline_archive_sha256 }}
          BASELINE_BINARY_SHA256: ${{ matrix.baseline_binary_sha256 }}
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/baseline"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/baseline/$ARCHIVE" "$BASELINE_URL"
          actual="$(shasum -a 256 "$RUNNER_TEMP/baseline/$ARCHIVE" | cut -d ' ' -f 1)"
          [[ "$actual" == "$BASELINE_ARCHIVE_SHA256" ]] || {
            echo "baseline archive checksum mismatch" >&2
            exit 1
          }
          tar -xJf "$RUNNER_TEMP/baseline/$ARCHIVE" -C "$RUNNER_TEMP/baseline"
          binary="$RUNNER_TEMP/baseline/${ROOT}/kick"
          [[ -x "$binary" ]] || {
            echo "baseline archive is missing kick" >&2
            exit 1
          }
          [[ "$(shasum -a 256 "$binary" | cut -d ' ' -f 1)" == "$BASELINE_BINARY_SHA256" ]] || {
            echo "baseline executable checksum mismatch" >&2
            exit 1
          }
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - id: baseline-windows
        name: Download and verify Windows baseline
        if: runner.os == 'Windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
          BASELINE_URL: ${{ matrix.baseline_url }}
          BASELINE_ARCHIVE_SHA256: ${{ matrix.baseline_archive_sha256 }}
          BASELINE_BINARY_SHA256: ${{ matrix.baseline_binary_sha256 }}
        shell: pwsh
        run: |
          $baseline = "$env:RUNNER_TEMP\baseline"
          New-Item -ItemType Directory -Path $baseline | Out-Null
          Invoke-WebRequest -Uri $env:BASELINE_URL -OutFile "$baseline\$env:ARCHIVE"
          $archiveActual = (Get-FileHash -Algorithm SHA256 -LiteralPath "$baseline\$env:ARCHIVE").Hash.ToLowerInvariant()
          if ($archiveActual -ne $env:BASELINE_ARCHIVE_SHA256) { throw "baseline archive checksum mismatch" }
          Expand-Archive -LiteralPath "$baseline\$env:ARCHIVE" -DestinationPath "$baseline\extracted"
          $binary = "$baseline\extracted\kick.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "baseline archive is missing kick.exe" }
          $binaryActual = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          if ($binaryActual -ne $env:BASELINE_BINARY_SHA256) { throw "baseline executable checksum mismatch" }
          "binary=$binary" >> $env:GITHUB_OUTPUT

      - id: windows-tui
        name: Exercise Windows pseudo-console lifecycle
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $emptyConfig = "$env:RUNNER_TEMP\qa-empty.toml"
          $tuiEvidence = "$env:RUNNER_TEMP\windows-tui.json"
          New-Item -ItemType File -Path $emptyConfig | Out-Null
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r qa\windows-tui-requirements.txt
          python qa\windows_tui_smoke.py `
            --binary '${{ steps.windows-artifact.outputs.canonical }}' `
            --config $emptyConfig `
            --output $tuiEvidence
          if (-not (Test-Path -LiteralPath $tuiEvidence -PathType Leaf)) { throw "ConPTY evidence was not published" }
          "evidence=$tuiEvidence" >> $env:GITHUB_OUTPUT

      - id: qa-unix
        name: Run Unix exploratory charters
        if: runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          python3 -m qa.release_qa \
            --canonical '${{ steps.unix-artifact.outputs.canonical }}' \
            --short '${{ steps.unix-artifact.outputs.short }}' \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --archive-sha256 '${{ steps.unix-artifact.outputs.archive_sha256 }}' \
            --output "qa-${{ matrix.name }}.json"

      - id: qa-windows
        name: Run Windows exploratory charters
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $arguments = @(
            '-m', 'qa.release_qa',
            '--canonical', '${{ steps.windows-artifact.outputs.canonical }}',
            '--short', '${{ steps.windows-artifact.outputs.short }}',
            '--candidate-commit', $env:CANDIDATE_COMMIT,
            '--archive-sha256', '${{ steps.windows-artifact.outputs.archive_sha256 }}',
            '--output', 'qa-${{ matrix.name }}.json'
          )
          $tuiEvidence = '${{ steps.windows-tui.outputs.evidence }}'
          if ($tuiEvidence -and (Test-Path -LiteralPath $tuiEvidence -PathType Leaf)) {
            $tuiReport = Get-Content -LiteralPath $tuiEvidence -Raw | ConvertFrom-Json
            if ($tuiReport.status -eq 'PASS') {
              $arguments += @('--windows-tui-evidence', $tuiEvidence)
            }
          }
          python @arguments

      - id: extended-qa-unix
        name: Run extended Unix exploratory charters
        if: runner.os != 'Windows'
        continue-on-error: true
        env:
          CANDIDATE_BINARY_SHA256: ${{ matrix.candidate_binary_sha256 }}
          BASELINE_BINARY_SHA256: ${{ matrix.baseline_binary_sha256 }}
        shell: bash
        run: |
          arguments=(
            --candidate '${{ steps.unix-artifact.outputs.short }}'
            --candidate-sha256 "$CANDIDATE_BINARY_SHA256"
            --baseline '${{ steps.baseline-unix.outputs.binary }}'
            --baseline-sha256 "$BASELINE_BINARY_SHA256"
            --candidate-commit "$CANDIDATE_COMMIT"
            --output "extended-qa-${{ matrix.name }}.json"
          )
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo -n true
            docker pull ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
            arguments+=(--privileged-watch)
          fi
          python3 -m qa.extended_release_qa "${arguments[@]}"

      - id: extended-qa-windows
        name: Run extended Windows exploratory charters
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          python -m qa.extended_release_qa `
            --candidate '${{ steps.windows-artifact.outputs.short }}' `
            --candidate-sha256 '${{ matrix.candidate_binary_sha256 }}' `
            --baseline '${{ steps.baseline-windows.outputs.binary }}' `
            --baseline-sha256 '${{ matrix.baseline_binary_sha256 }}' `
            --candidate-commit $env:CANDIDATE_COMMIT `
            --output 'extended-qa-${{ matrix.name }}.json'

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-qa-${{ matrix.name }}
          path: |
            qa-${{ matrix.name }}.json
            extended-qa-${{ matrix.name }}.json
            ${{ steps.windows-tui.outputs.evidence }}
          if-no-files-found: error
          retention-days: 90

      - name: Require a passing QA verdict
        if: always()
        env:
          REPORT: qa-${{ matrix.name }}.json
          EXTENDED_REPORT: extended-qa-${{ matrix.name }}.json
        shell: bash
        run: |
          python3 - "$REPORT" "$EXTENDED_REPORT" <<'PY'
          import json
          import pathlib
          import sys

          for filename in sys.argv[1:]:
              report = json.loads(pathlib.Path(filename).read_text(encoding="utf-8"))
              if report.get("overall") != "PASS":
                  raise SystemExit(f"{filename} verdict is {report.get('overall')}")
          PY

  benchmark:
    needs: qa
    if: inputs.run_benchmarks || inputs.benchmark_smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            artifact: artifacts-build-local-x86_64-unknown-linux-gnu
            archive: kickoutchi-x86_64-unknown-linux-gnu.tar.xz
            root: kickoutchi-x86_64-unknown-linux-gnu
            baseline_url: https://github.com/nuggocto/kickoutchi/releases/download/v1.2.0/kickoutchi-x86_64-unknown-linux-gnu.tar.xz
            baseline_sha256: f855ba6c0c0e4a08096aa180de67999d918d2b883a84f201922012d47504548c
          - name: windows-x86_64
            runner: windows-2022
            artifact: artifacts-build-local-x86_64-pc-windows-msvc
            archive: kickoutchi-x86_64-pc-windows-msvc.zip
            root: .
            baseline_url: https://github.com/nuggocto/kickoutchi/releases/download/v1.2.0/kickoutchi-x86_64-pc-windows-msvc.zip
            baseline_sha256: 71a5004a8d503284034659e70e1d5a861e26d9f362ea0f42c097518718db8d24
    name: Benchmark (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Test benchmark harness
        shell: bash
        run: |
          if [[ '${{ inputs.run_benchmarks }}' == 'true' && '${{ inputs.benchmark_smoke }}' == 'true' ]]; then
            echo "full and smoke benchmark modes are mutually exclusive" >&2
            exit 1
          fi
          python3 -m unittest -v benchmarks.release.test_release_benchmark

      - id: diff-helper
        name: Build exact-source diff helper
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo build --locked --release --manifest-path benchmarks/release/diff_helper/Cargo.toml
          helper="benchmarks/release/diff_helper/target/release/kickoutchi-release-diff-helper"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            helper="${helper}.exe"
          fi
          [[ -f "$helper" ]] || {
            echo "diff helper was not built" >&2
            exit 1
          }
          echo "path=$(pwd)/$helper" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$helper" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          for scenario in empty typical large maximum_same maximum_replacement snapshot_large snapshot_maximum watch_high_churn watch_transient_recovery watch_failure_exhaustion; do
            "$helper" "$scenario" | python3 -c 'import json,sys; value=json.load(sys.stdin); assert value["scenario"] == sys.argv[1]' "$scenario"
          done

      - name: Download exact candidate archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - id: prepare-unix
        name: Prepare Unix artifacts
        if: runner.os != 'Windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
          ROOT: ${{ matrix.root }}
          BASELINE_URL: ${{ matrix.baseline_url }}
          BASELINE_SHA256: ${{ matrix.baseline_sha256 }}
        shell: bash
        run: |
          candidate_expected="$(cut -d ' ' -f 1 "$RUNNER_TEMP/candidate/${ARCHIVE}.sha256")"
          candidate_actual="$(shasum -a 256 "$RUNNER_TEMP/candidate/$ARCHIVE" | cut -d ' ' -f 1)"
          [[ "$candidate_actual" == "$candidate_expected" ]] || exit 1
          mkdir "$RUNNER_TEMP/candidate/extracted" "$RUNNER_TEMP/baseline"
          tar -xJf "$RUNNER_TEMP/candidate/$ARCHIVE" -C "$RUNNER_TEMP/candidate/extracted"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/baseline/$ARCHIVE" "$BASELINE_URL"
          baseline_actual="$(shasum -a 256 "$RUNNER_TEMP/baseline/$ARCHIVE" | cut -d ' ' -f 1)"
          [[ "$baseline_actual" == "$BASELINE_SHA256" ]] || exit 1
          tar -xJf "$RUNNER_TEMP/baseline/$ARCHIVE" -C "$RUNNER_TEMP/baseline"
          echo "candidate=${RUNNER_TEMP}/candidate/extracted/${ROOT}/kick" >> "$GITHUB_OUTPUT"
          echo "baseline=${RUNNER_TEMP}/baseline/${ROOT}/kick" >> "$GITHUB_OUTPUT"

      - id: prepare-windows
        name: Prepare Windows artifacts
        if: runner.os == 'Windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
          BASELINE_URL: ${{ matrix.baseline_url }}
          BASELINE_SHA256: ${{ matrix.baseline_sha256 }}
        shell: pwsh
        run: |
          $candidate = "$env:RUNNER_TEMP\candidate"
          $baseline = "$env:RUNNER_TEMP\baseline"
          $sidecar = (Get-Content -LiteralPath "$candidate\$env:ARCHIVE.sha256" -Raw).Trim()
          if ($sidecar -notmatch '^([0-9a-f]{64}) [ *][^\r\n]+$') { throw "candidate checksum sidecar is malformed" }
          $candidateActual = (Get-FileHash -Algorithm SHA256 -LiteralPath "$candidate\$env:ARCHIVE").Hash.ToLowerInvariant()
          if ($candidateActual -ne $Matches[1]) { throw "candidate checksum mismatch" }
          Expand-Archive -LiteralPath "$candidate\$env:ARCHIVE" -DestinationPath "$candidate\extracted"
          New-Item -ItemType Directory -Path $baseline | Out-Null
          Invoke-WebRequest -Uri $env:BASELINE_URL -OutFile "$baseline\$env:ARCHIVE"
          $baselineActual = (Get-FileHash -Algorithm SHA256 -LiteralPath "$baseline\$env:ARCHIVE").Hash.ToLowerInvariant()
          if ($baselineActual -ne $env:BASELINE_SHA256) { throw "baseline checksum mismatch" }
          Expand-Archive -LiteralPath "$baseline\$env:ARCHIVE" -DestinationPath "$baseline\extracted"
          "candidate=$candidate\extracted\kick.exe" >> $env:GITHUB_OUTPUT
          "baseline=$baseline\extracted\kick.exe" >> $env:GITHUB_OUTPUT

      - id: collect
        name: Collect native benchmark evidence
        continue-on-error: true
        shell: bash
        run: |
          mode=()
          if [[ '${{ inputs.benchmark_smoke }}' == 'true' ]]; then
            mode+=(--smoke)
          fi
          controller=(
            python3 benchmarks/release/controller.py
            --plan benchmarks/release/plan.json
            --baseline '${{ steps.prepare-unix.outputs.baseline || steps.prepare-windows.outputs.baseline }}'
            --candidate '${{ steps.prepare-unix.outputs.candidate || steps.prepare-windows.outputs.candidate }}'
            --diff-helper '${{ steps.diff-helper.outputs.path }}'
            --output release-raw.jsonl
            --manifest release-manifest.json
            "${mode[@]}"
          )
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            parent_netns="$(readlink /proc/self/ns/net)"
            sudo --preserve-env=PATH,RUSTUP_TOOLCHAIN unshare --net -- \
              bash -c 'ip link set lo up && exec "$@"' bash \
              env KICKOUTCHI_PARENT_NETNS="$parent_netns" "${controller[@]}"
          else
            "${controller[@]}"
          fi
          python3 benchmarks/release/summarize.py \
            --plan benchmarks/release/plan.json \
            --raw release-raw.jsonl \
            --manifest release-manifest.json \
            --output release-summary.json

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-benchmark-${{ matrix.name }}
          path: |
            release-raw.jsonl
            release-manifest.json
            release-summary.json
          if-no-files-found: error
          retention-days: 90

      - name: Require the declared benchmark verdict
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          report = json.loads(pathlib.Path("release-summary.json").read_text(encoding="utf-8"))
          smoke = "${{ inputs.benchmark_smoke }}" == "true"
          if smoke:
              if report.get("verdict") not in {"PASS", "INCONCLUSIVE"} or report.get("gate_eligible"):
                  raise SystemExit(f"smoke benchmark verdict is {report.get('verdict')}")
          elif report.get("verdict") != "PASS" or not report.get("gate_eligible"):
              raise SystemExit(f"benchmark verdict is {report.get('verdict')}")
          PY
