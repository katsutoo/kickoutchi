name: Repair Release Manifest Attestation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH release tag to repair
        required: true
        type: string

permissions:
  contents: read

jobs:
  attest:
    name: Attest existing release manifest
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact published manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "release_tag must be a vMAJOR.MINOR.PATCH tag" >&2
              exit 1
              ;;
          esac

          test "$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft
          )" = false
          mkdir -p "$RUNNER_TEMP/published-manifest"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern dist-manifest.json \
            --dir "$RUNNER_TEMP/published-manifest"
          test -f "$RUNNER_TEMP/published-manifest/dist-manifest.json"
      - name: Generate release-manifest attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ runner.temp }}/published-manifest/dist-manifest.json
      - name: Verify release-manifest attestation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify \
            "$RUNNER_TEMP/published-manifest/dist-manifest.json" \
            --repo "$GITHUB_REPOSITORY"
