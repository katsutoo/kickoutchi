name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.95.0

jobs:
  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Use pinned Rust toolchain
        run: rustup default "$RUST_VERSION"

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.19.4

      - name: Test release artifact validator
        run: cargo test --locked --test release_artifact_validator

      - name: Run cargo-deny
        run: cargo deny check

  linux:
    name: Linux
    needs: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy

      - name: Use pinned Rust toolchain
        run: rustup default "$RUST_VERSION"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Enable unprivileged user namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run tests
        run: KICKOUTCHI_REQUIRE_LINUX_CAPABILITIES=1 cargo test --locked --all-features

      - name: Run doctests
        run: cargo test --locked --all-features --doc

      - name: Build release binaries
        run: cargo build --locked --release --all-features --bin kickoutchi --bin kick

      - name: Run release binary journeys
        env:
          KICKOUTCHI_RELEASE_E2E_REQUIRED: "1"
          KICKOUTCHI_E2E_KICKOUTCHI: ${{ github.workspace }}/target/release/kickoutchi
          KICKOUTCHI_E2E_KICK: ${{ github.workspace }}/target/release/kick
          KICKOUTCHI_REQUIRE_LINUX_CAPABILITIES: "1"
        run: cargo test --locked --all-features --test cli_contract

  nix:
    name: Nix (${{ matrix.system }})
    needs: supply-chain
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Evaluate every declared Nix system
        run: nix flake check --no-update-lock-file --all-systems

      - name: Build and verify native Nix package
        run: |
          nix build --no-update-lock-file ".#packages.${{ matrix.system }}.kickoutchi"
          test "$(./result/bin/kickoutchi --version)" = "kickoutchi 1.3.4"
          test "$(cat ./result/share/kickoutchi/install-provenance)" = "nix"

  windows:
    name: Windows
    needs: supply-chain
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy

      - name: Use pinned Rust toolchain
        shell: bash
        run: rustup default "$RUST_VERSION"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Run doctests
        run: cargo test --locked --all-features --doc

      - name: Build release binaries
        run: cargo build --locked --release --all-features --bin kickoutchi --bin kick

      - name: Run release binary journeys
        env:
          KICKOUTCHI_RELEASE_E2E_REQUIRED: "1"
          KICKOUTCHI_E2E_KICKOUTCHI: ${{ github.workspace }}\target\release\kickoutchi.exe
          KICKOUTCHI_E2E_KICK: ${{ github.workspace }}\target\release\kick.exe
        run: cargo test --locked --all-features --test cli_contract

  macos:
    name: macOS
    needs: supply-chain
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy

      - name: Use pinned Rust toolchain
        run: rustup default "$RUST_VERSION"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Run doctests
        run: cargo test --locked --all-features --doc

      - name: Build release binaries
        run: cargo build --locked --release --all-features --bin kickoutchi --bin kick

      - name: Run release binary journeys
        env:
          KICKOUTCHI_RELEASE_E2E_REQUIRED: "1"
          KICKOUTCHI_E2E_KICKOUTCHI: ${{ github.workspace }}/target/release/kickoutchi
          KICKOUTCHI_E2E_KICK: ${{ github.workspace }}/target/release/kick
        run: cargo test --locked --all-features --test cli_contract
