[tools]
rust = "1.95.0"

[tasks.fmt]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.clippy]
description = "Run strict Clippy"
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

# Local Linux clippy never compiles `#[cfg(windows)]` bodies, so Windows-only
# lints (e.g. in platform/windows.rs or the Windows arms of process.rs) stay
# invisible until the Windows CI job runs. The x86_64-pc-windows-gnu target
# lints the same gated code from Linux. Kept out of `check` on purpose: it pulls
# in a Windows compile, so run it before pushing changes that touch cfg(windows).
[tasks.clippy-windows]
description = "Run strict Clippy against the cfg(windows) code from Linux"
run = "cargo clippy --locked --target x86_64-pc-windows-gnu --all-targets --all-features -- -D warnings"

# Local Linux checks never compile `#[cfg(target_os = "macos")]` bodies. These
# Darwin targets lint/check the native macOS collector and signal path from
# Linux before the macOS CI job gets a chance to run them for real.
[tasks.check-macos]
description = "Check cfg(target_os = macos) code from Linux"
run = [
  "cargo check --locked --target x86_64-apple-darwin --all-targets --all-features",
  "cargo check --locked --target aarch64-apple-darwin --all-targets --all-features",
]

[tasks.clippy-macos]
description = "Run strict Clippy against cfg(target_os = macos) code from Linux"
run = [
  "cargo clippy --locked --target x86_64-apple-darwin --all-targets --all-features -- -D warnings",
  "cargo clippy --locked --target aarch64-apple-darwin --all-targets --all-features -- -D warnings",
]

[tasks.test]
description = "Run the full test suite"
run = "cargo test --locked --all-features"

[tasks.test-doc]
description = "Run documentation tests"
run = "cargo test --locked --all-features --doc"

[tasks.build-release]
description = "Build both optimized release binaries"
run = "cargo build --locked --release --all-features --bin kickoutchi --bin kick"

[tasks.deny]
description = "Run cargo-deny policy checks"
run = "cargo deny check"

[tasks.check]
description = "Run host checks; capability-gated Linux contracts may skip"
run = [
  "cargo fmt --all --check",
  "cargo clippy --locked --all-targets --all-features -- -D warnings",
  "cargo test --locked --all-features",
  "cargo test --locked --all-features --doc",
  "cargo build --locked --release --all-features --bin kickoutchi --bin kick",
  "cargo deny check",
]

[tasks.check-linux-gate]
description = "Run the capability-required Linux CI gate"
run = [
  "cargo fmt --all --check",
  "cargo clippy --locked --all-targets --all-features -- -D warnings",
  "KICKOUTCHI_REQUIRE_LINUX_CAPABILITIES=1 cargo test --locked --all-features",
  "cargo test --locked --all-features --doc",
  "cargo build --locked --release --all-features --bin kickoutchi --bin kick",
  "KICKOUTCHI_RELEASE_E2E_REQUIRED=1 KICKOUTCHI_E2E_KICKOUTCHI=target/release/kickoutchi KICKOUTCHI_E2E_KICK=target/release/kick KICKOUTCHI_REQUIRE_LINUX_CAPABILITIES=1 cargo test --locked --all-features --test cli_contract",
  "cargo deny check",
]

[tasks.tui]
description = "Run the TUI"
run = "cargo run --locked"

[tasks.list]
description = "Run the CLI list command"
run = "cargo run --locked -- list"
