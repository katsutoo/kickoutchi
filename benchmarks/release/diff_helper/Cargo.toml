[package]
name = "kickoutchi-release-diff-helper"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "kickoutchi-release-diff-helper"
path = "src/main.rs"
test = false

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
unicode-width = "=0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
