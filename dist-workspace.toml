[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Build and upload packages on pull requests so release packaging is exercised
# before a tag can publish the same artifact graph.
pr-run-mode = "upload"
# release.yml is cargo-dist-generated but intentionally hardened in-repo with
# pinned action SHAs and narrower job permissions.
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Homebrew tap that receives the generated formula. The publish-homebrew-formula
# job in release.yml pushes to it with HOMEBREW_TAP_TOKEN. release.yml is
# hand-hardened (pinned SHAs, narrowed permissions), so that job is kept in sync
# with `dist generate` by hand rather than regenerated.
tap = "nuggocto/homebrew-tap"
publish-jobs = ["homebrew"]
# Whether to install an updater program
install-updater = true
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"

[dist.github-action-commits]
"actions/checkout" = "v7.0.0"
"actions/upload-artifact" = "v7.0.1"
"actions/download-artifact" = "v8.0.1"
