[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Build and upload packages on pull requests so release packaging is exercised
# before a tag can publish the same artifact graph.
pr-run-mode = "upload"
# release.yml began as cargo-dist output but is intentionally maintained in-repo
# with pinned actions, narrow permissions, same-run native gates, bounded archive
# validation, and scoped publication credentials. Review generated changes by
# hand instead of overwriting those controls.
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Homebrew tap that receives the generated formula. The publish-homebrew-formula
# job in release.yml pushes to it with HOMEBREW_TAP_TOKEN. release.yml is
# hand-hardened, so that job is kept in sync with cargo-dist changes by review
# rather than blindly regenerated.
tap = "nuggocto/homebrew-tap"
publish-jobs = ["homebrew"]
# Whether to install an updater program
install-updater = true
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Linux release binaries are built in Debian 11 containers and must not acquire
# symbols newer than the declared glibc 2.31 floor.
min-glibc-version = { "aarch64-unknown-linux-gnu" = "2.31", "x86_64-unknown-linux-gnu" = "2.31" }
# Path that installers should place binaries in
install-path = "CARGO_HOME"

[dist.github-action-commits]
"actions/checkout" = "v7.0.0"
"actions/upload-artifact" = "v7.0.1"
"actions/download-artifact" = "v8.0.1"

# The namespace capability journey hangs on the older Ubuntu 22.04 runner
# kernels. Keep archive execution native while matching the passing CI kernel.
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = { runner = "ubuntu-22.04", host = "x86_64-unknown-linux-gnu", container = { image = "rust:1.95-bullseye", host = "x86_64-unknown-linux-gnu", package-manager = "apt" } }
aarch64-unknown-linux-gnu = { runner = "ubuntu-24.04-arm", host = "aarch64-unknown-linux-gnu", container = { image = "rust:1.95-bullseye", host = "aarch64-unknown-linux-gnu", package-manager = "apt" } }
